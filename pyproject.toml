[project]
name = "ai-coastal-security-demo"
version = "0.1.0"
description = "Synthetic-data research demonstrator displaying saved coastal analytics results"
requires-python = ">=3.13,<3.14"
dependencies = ["pandas==3.0.6", "pillow==12.3.0", "streamlit==1.66.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0", "pip-audit==2.10.1"]
# Exploratory tools: legacy training methodology is not validated.
research = [
    "joblib==1.6.0",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "notebook==7.6.3",
    "scikit-learn==1.9.1",
    "seaborn==0.13.2",
]

[tool.uv]
package = false
required-version = "==0.13.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
include = [
    "dashboard/*.py",
    "tests/*.py",
    "scripts/*.py",
    "setup_project.py",
    "coastal_security/**/*.py",
    "training_tests/*.py",
    "browser_tests/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
